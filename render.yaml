# Render blueprint for InferSight — frontend (static), API (web), Postgres.
#
# Deploy from the Render dashboard: "New > Blueprint" and select this repo.
# Render creates the Postgres database and both services automatically and
# prompts for the two `sync: false` secrets (SECRET_KEY, ADMIN_PASSWORD).
#
# Service URLs are wired automatically:
#   - VITE_API_URL is baked into the frontend build from the API hostname.
#   - CORS_ORIGINS is derived from FRONTEND_URL (the static site hostname),
#     appended to the defaults by app.core.config.

services:
  # ---- Frontend: Vite + React static site ----
  - type: web
    name: infersight-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && VITE_API_URL=https://$API_HOST/api/v1 npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: infersight-api
          property: host
      - key: NODE_VERSION
        value: "22"

  # ---- API: FastAPI web service ----
  - type: web
    name: infersight-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: AUTO_CREATE_TABLES
        value: "true"
      - key: REDIS_ENABLED
        value: "false"
      - key: CELERY_ENABLED
        value: "false"
      - key: ADMIN_EMAIL
        value: admin@infersight.dev
      # Set these once via the dashboard or blueprint prompt:
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Frontend origin for CORS — derived from the static site hostname:
      - key: FRONTEND_URL
        fromService:
          type: web
          name: infersight-web
          property: host
      # Attached Postgres — injected automatically by Render:
      - key: DATABASE_URL
        fromDatabase:
          name: infersight-db
          property: connectionString

databases:
  - name: infersight-db
    plan: basic-256mb
    databaseName: infersight
    user: infersight
